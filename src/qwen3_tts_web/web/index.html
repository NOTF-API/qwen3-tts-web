<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qwen3-TTS · 语音工作台</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
    }

    body {
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      font-size: 12px;
      color: #cfd4da;
      background: #0c0e11;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ============ 顶部 ============ */
    header {
      flex: 0 0 auto;
      min-height: 46px;
      flex-wrap: wrap;
      display: flex;
      align-items: center;
      padding: 8px 14px;
      gap: 10px;
      background: #111418;
      border-bottom: 1px solid #1e2126;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .brand .logo {
      font-size: 16px;
    }

    .brand .title {
      font-size: 13px;
      font-weight: 700;
      color: #e6ebf0;
      letter-spacing: 0;
    }

    .brand .subtitle {
      font-size: 10px;
      color: #9099a3;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .spacer {
      flex: 1;
    }

    .nav-link {
      color: #72e68a;
      font-size: 12px;
      text-decoration: none;
      white-space: nowrap;
      padding: 6px 0;
    }

    .nav-link:hover { color: #b1f4bf; }
    :focus-visible { outline: 2px solid #72e68a; outline-offset: 3px; }

    .queue-indicator {
      font: 10px monospace;
      color: #e6b800;
      padding: 3px 8px;
      border-radius: 4px;
      background: rgba(230, 184, 0, .08);
      border: 1px solid rgba(230, 184, 0, .25);
      display: none;
    }

    .queue-indicator.on {
      display: inline-block;
    }

    .tool-btn {
      padding: 6px 12px;
      font-size: 11px;
      color: #b8bfc6;
      background: #1a1d22;
      border: 1px solid #2a2e35;
      border-radius: 5px;
      cursor: pointer;
      transition: all .1s;
    }

    .tool-btn:hover:not(:disabled) {
      background: #22262c;
      color: #e6ebf0;
      border-color: #3a4048;
    }

    .tool-btn:disabled {
      opacity: .35;
      cursor: not-allowed;
    }

    .tool-btn.primary {
      color: #72e68a;
      border-color: #2f5a3a;
      background: #16261b;
    }

    .tool-btn.primary:hover:not(:disabled) {
      background: #1d3424;
    }

    .tool-btn.danger {
      color: #e66;
      border-color: #5a2828;
    }

    .tool-btn.danger:hover:not(:disabled) {
      background: #2b1a1a;
    }

    /* ============ 布局 ============ */
    .layout {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    aside {
      flex: 0 0 300px;
      overflow-y: auto;
      background: #0f1216;
      border-right: 1px solid #1e2126;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    aside::-webkit-scrollbar {
      width: 6px;
    }

    aside::-webkit-scrollbar-thumb {
      background: #23272e;
      border-radius: 3px;
    }

    main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: auto;
    }

    footer {
      flex: 0 0 auto;
      height: 26px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      gap: 16px;
      font: 11px monospace;
      color: #586069;
      background: #111418;
      border-top: 1px solid #1e2126;
    }

    footer .stat {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    footer .stat b {
      color: #8a949e;
      font-weight: 600;
    }

    footer .sep {
      color: #2a2e35;
    }

    /* ============ 侧栏卡片 ============ */
    .card {
      border-bottom: 1px solid #272c32;
      padding: 4px 4px 16px;
    }

    .card h3 {
      margin: 0 0 10px 0;
      font-size: 12px;
      font-weight: 700;
      color: #a5afb9;
      letter-spacing: 0;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card h3 .badge {
      font: 10px monospace;
      font-weight: 400;
      color: #586069;
      letter-spacing: 0;
      text-transform: none;
    }

    .field {
      margin-bottom: 8px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    .field label {
      display: block;
      margin-bottom: 4px;
      font-size: 10px;
      color: #586069;
      letter-spacing: 0;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    input[type="text"],
    input[type="number"],
    select,
    textarea {
      width: 100%;
      padding: 6px 9px;
      font-size: 12px;
      font-family: inherit;
      color: #c8ced5;
      background: #0c0e11;
      border: 1px solid #2a2e35;
      border-radius: 5px;
      outline: none;
      transition: border-color .1s, background .1s, color .1s;
    }

    input:hover,
    select:hover,
    textarea:hover {
      border-color: #3a4048;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #4a7ef2;
      background: #0e1116;
    }

    textarea {
      resize: vertical;
      min-height: 72px;
      line-height: 1.5;
      cursor: text;
    }

    select {
      cursor: pointer;
    }

    select option {
      background: #14171c;
    }

    .btn {
      width: 100%;
      padding: 8px 10px;
      font-size: 12px;
      font-family: inherit;
      font-weight: 600;
      color: #b8bfc6;
      background: #1a1d22;
      border: 1px solid #2a2e35;
      border-radius: 5px;
      cursor: pointer;
      transition: all .1s;
    }

    .btn:hover:not(:disabled) {
      background: #22262c;
      color: #e6ebf0;
      border-color: #3a4048;
    }

    .btn:active:not(:disabled) {
      transform: translateY(1px);
    }

    .btn:disabled {
      opacity: .35;
      cursor: not-allowed;
    }

    .btn.primary {
      color: #72e68a;
      border-color: #2f5a3a;
      background: #16261b;
    }

    .btn.primary:hover:not(:disabled) {
      background: #1d3424;
    }

    .btn.small {
      font-size: 11px;
      padding: 6px 8px;
      font-weight: 400;
    }

    .gen-status {
      font: 10px monospace;
      color: #586069;
      margin-top: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .gen-status.gen {
      color: #e6b800;
    }

    .gen-status.ok {
      color: #72e68a;
    }

    .gen-status.err {
      color: #e66;
    }

    .generation-actions { display: grid; gap: 8px; }
    .auto-generate { display: flex; align-items: center; gap: 7px; margin-top: 12px; color: #b8bfc6; font-size: 11px; cursor: pointer; }
    .queue-hint { margin: 8px 0 0; color: #a4a9af; font-size: 11px; line-height: 1.6; }

    /* ============ 列表 ============ */
    .list-header,
    .clip-row {
      display: grid;
      grid-template-columns:
        20px
        /* grip */
        26px
        /* idx */
        108px
        /* 角色 */
        96px
        /* 情感 */
        minmax(140px, 1fr)
        /* 文本 */
        96px
        /* 设备 */
        96px
        /* 信号 */
        54px
        /* 延迟 */
        28px 28px 28px 28px 28px;
      /* ▶ ↻ × */
      gap: 4px;
      align-items: center;
    }

    .list-header, .list { min-width: 930px; }

    .list-header {
      flex: 0 0 auto;
      padding: 6px 10px;
      background: #111418;
      border-bottom: 1px solid #1e2126;
      font: 10px monospace;
      color: #586069;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .list-header .hdr {
      text-align: center;
    }

    .list-header .hdr.left {
      text-align: left;
      padding-left: 2px;
    }

    .list {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .list::-webkit-scrollbar {
      width: 8px;
    }

    .list::-webkit-scrollbar-thumb {
      background: #23272e;
      border-radius: 4px;
    }

    .list::-webkit-scrollbar-thumb:hover {
      background: #2e333b;
    }

    /* 行：用 --role-* 变量着色，左竖条用 ::before */
    .clip-row {
      padding: 14px 10px;
      border-bottom: 1px solid #16191d;
      font-size: 11px;
      position: relative;
      transition: background .1s;
    }

    .clip-row:hover {
      background: rgba(255, 255, 255, .02);
    }

    .clip-row::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--role-color, transparent);
      transition: background .1s;
    }

    .clip-row.playing::before {
      background: #72e68a;
    }

    .clip-row.queued::before {
      background: #a8a862;
    }

    .clip-row.generating::before {
      background: #e6b800;
    }

    .clip-row.playing {
      background: rgba(114, 230, 138, .05);
    }

    .clip-row.queued {
      background: rgba(168, 168, 98, .05);
    }

    .clip-row.generating {
      background: rgba(230, 184, 0, .07);
    }

    .clip-row.dirty {
      background: rgba(91, 141, 239, .05);
    }

    .clip-row.dragging {
      opacity: .3;
    }

    .clip-row.drop-target {
      box-shadow: inset 0 -2px 0 #72e68a;
    }

    .grip {
      text-align: center;
      font-size: 13px;
      line-height: 1;
      color: #3a4048;
      cursor: grab;
      user-select: none;
      letter-spacing: 0;
      padding: 2px 0;
    }

    .grip:hover {
      color: #8a949e;
      background: #1a1d22;
    }

    .grip:active {
      cursor: grabbing;
    }

    .grip[aria-disabled="true"] {
      opacity: .2;
      cursor: not-allowed;
      pointer-events: none;
    }

    .idx {
      text-align: right;
      padding-right: 4px;
      font: 10px monospace;
      color: #4a5159;
    }

    .clip-row.playing .idx {
      color: #72e68a;
    }

    .cell-input,
    .cell-select {
      width: 100%;
      padding: 4px 7px;
      font-size: 11px;
      font-family: inherit;
      color: #c8ced5;
      background: #0e1116;
      border: 1px solid #23272e;
      border-radius: 4px;
      outline: none;
      cursor: pointer;
      transition: border-color .1s, color .1s, background .1s;
    }

    .cell-input:focus,
    .cell-select:focus {
      border-color: #4a7ef2;
    }

    .cell-input:hover:not(:disabled),
    .cell-select:hover:not(:disabled) {
      border-color: #3a4048;
    }

    .cell-input:disabled,
    .cell-select:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    /* 角色：着色 */
    .role-select {
      background: var(--role-bg, #0e1116);
      color: var(--role-fg, #c8ced5);
      border-color: var(--role-border, #23272e);
      font-weight: 600;
    }

    .role-select:hover:not(:disabled) {
      border-color: var(--role-fg, #3a4048);
    }

    .role-select option {
      background: #0e1116;
      color: #c8ced5;
    }

    /* 情感：跟随角色，色淡一些 */
    .emo-select {
      color: var(--role-fg, #c8ced5);
      border-color: var(--role-border, #23272e);
    }

    .text-cell {
      cursor: text;
      min-width: 0;
    }

    .text-cell.changed {
      color: #8fb8f2;
      border-color: #2a3d5a;
    }

    .delay-wrap {
      position: relative;
    }

    .delay-wrap .cell-input {
      padding-right: 16px;
      text-align: center;
    }

    .delay-wrap::after {
      content: "s";
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 9px;
      color: #4a5159;
      pointer-events: none;
    }

    .icon-btn {
      width: 26px;
      height: 26px;
      padding: 0;
      font-size: 12px;
      line-height: 24px;
      text-align: center;
      color: #6a737d;
      background: #16191d;
      border: 1px solid #23272e;
      border-radius: 4px;
      cursor: pointer;
      transition: all .1s;
    }

    .icon-btn:hover:not(:disabled) {
      background: #1e2228;
      color: #cfd4da;
    }

    .icon-btn:disabled {
      opacity: .25;
      cursor: not-allowed;
    }

    .icon-btn.play:not(:disabled) {
      color: #72e68a;
      border-color: #2f5a3a;
      background: #16261b;
    }

    .icon-btn.play.active {
      color: #e66;
      border-color: #5a2828;
      background: #2b1a1a;
    }

    .icon-btn.regen {
      color: #e6b800;
      border-color: #4a4018;
    }

    .icon-btn.regen.hot {
      color: #ffcf3a;
      border-color: #6a5a1a;
      background: #2b2408;
    }

    .icon-btn.regen:hover:not(:disabled) {
      background: #2b2408;
    }

    .icon-btn.del:hover:not(:disabled) {
      color: #e66;
      border-color: #5a2828;
      background: #2b1a1a;
    }

    .empty {
      padding: 80px 20px;
      text-align: center;
      color: #3a4048;
      font-size: 12px;
    }

    .empty b {
      color: #586069;
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
    }

    .row-badge {
      position: absolute;
      right: 8px;
      top: 2px;
      font: 9px monospace;
      letter-spacing: 0;
      padding: 2px 6px;
      border-radius: 3px;
      pointer-events: none;
      display: none;
    }

    .clip-row.queued .row-badge {
      display: block;
      color: #a8a862;
      background: rgba(168, 168, 98, .12);
    }

    .clip-row.generating .row-badge {
      display: block;
      color: #e6b800;
      background: rgba(230, 184, 0, .15);
    }
    [hidden] { display: none !important; }
    .mode-tabs { display: flex; gap: 0; border-bottom: 1px solid #34383e; margin-bottom: 16px; }
    .mode-tab { flex: 1; padding: 10px 4px; background: none; border: 0; border-bottom: 2px solid transparent; color: #a4a9af; cursor: pointer; font: inherit; }
    .mode-tab[aria-selected="true"] { color: #79dab6; border-bottom-color: #79dab6; }
    .library-bar { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; padding: 14px; border-bottom: 1px solid #303238; }
    .library-bar h2 { font-size: 15px; margin: 0; color: #e5e5e5; }
    .library-bar input[type=search] { min-width: 120px; width: 200px; padding: 7px 10px; color: #ddd; background: #191b1e; border: 1px solid #393c40; border-radius: 4px; }
    .library-scroll { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: auto; }
    .clip-info { min-width: 0; }
    .clip-title { display: block; border: 0; background: none; color: #ececee; padding: 0 0 6px; font: inherit; font-weight: 600; width: 100%; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
    .clip-meta { color: #a4a9af; padding-top: 6px; font-size: 10px; overflow-wrap: anywhere; }
    .clip-error { color: #f09191; }
    .design-label { color: #deb777; }
    input[type=checkbox] { accent-color: #79dab6; cursor: pointer; }
    .gen-status { white-space: normal; height: auto; min-height: 20px; overflow-wrap: anywhere; }
    dialog { width: min(540px, calc(100% - 32px)); max-height: 90vh; overflow-y: auto; padding: 24px; color: #ddd; background: #191b1e; border: 1px solid #4a4c50; border-radius: 8px; }
    dialog::backdrop { background: #0009; }
    dialog h2 { margin: 0 0 20px; font-size: 18px; }
    dialog .actions { display: flex; gap: 12px; justify-content: flex-end; }
    .library-bar .tool-btn { min-height: 30px; }
    .empty { color: #adb2b7; }
    .advanced-controls summary { padding: 12px 4px; color: #bfc4c8; cursor: pointer; }
    .advanced-controls .card { margin-top: 12px; }
  </style>
</head>

<body>

  <header>
    <div class="brand">
      <span class="title">Qwen3-TTS</span>
      <span class="subtitle">语音工作台</span>
    </div>
    <div class="spacer"></div>
    <a class="nav-link" href="/maker">克隆音色</a>
    <span class="queue-indicator" id="queueIndicator"></span>
    <button class="tool-btn primary" id="playBtn" disabled>▶ 播放全部</button>
    <button class="tool-btn" id="stopBtn" disabled>■ 停止</button>
    <button class="tool-btn danger" id="clearBtn" disabled>删除全部</button>
  </header>

  <div class="layout">

    <!-- ============ 侧栏 ============ -->
    <aside>

      <section class="card">
        <h3>生成语音 <span class="badge" id="ptHint">加载中…</span></h3>
        <div class="mode-tabs" role="tablist" aria-label="生成方式">
          <button class="mode-tab" id="cloneTab" role="tab" aria-selected="true" aria-controls="cloneFields">角色音色</button>
          <button class="mode-tab" id="designTab" role="tab" aria-selected="false" aria-controls="designFields">描述音色</button>
        </div>
        <div id="cloneFields" role="tabpanel" aria-labelledby="cloneTab">
        <div class="field">
          <label for="genRole">角色</label>
          <select id="genRole"></select>
        </div>
        <div class="field">
          <label for="genEmotion">情绪（选填）</label>
          <input type="text" id="genEmotion" list="genEmotionOptions" placeholder="默认 · 平静" maxlength="30" autocomplete="off">
          <datalist id="genEmotionOptions"></datalist>
        </div>
        </div>
        <div id="designFields" role="tabpanel" aria-labelledby="designTab" hidden>
          <div class="field">
            <label for="genInstruct">音色描述</label>
            <textarea id="genInstruct" maxlength="2000" placeholder="年轻女性，温暖清晰的中音，语速舒缓，带自然的微笑感。"></textarea>
          </div>
          <div class="gen-status" id="designModelStatus">VoiceDesign · 检查中</div>
        </div>
        <div class="field">
          <label for="genLanguage">语言</label>
          <select id="genLanguage">
            <option value="Chinese" lang="zh">中文</option>
            <option value="English" lang="en">English</option>
            <option value="Japanese" lang="ja">日本語</option>
            <option value="Korean" lang="ko">한국어</option>
            <option value="French" lang="fr">Français</option>
            <option value="German" lang="de">Deutsch</option>
            <option value="Spanish" lang="es">Español</option>
            <option value="Italian" lang="it">Italiano</option>
            <option value="Portuguese" lang="pt">Português</option>
            <option value="Russian" lang="ru">Русский</option>
            <option value="Auto">自动检测</option>
          </select>
        </div>
        <div class="field">
          <label for="genText">台词</label>
          <textarea id="genText" maxlength="10000" placeholder="输入台词…"></textarea>
        </div>
        <div class="generation-actions">
          <button class="btn" id="genBtn" title="Ctrl / ⌘ + Enter">+ 暂存任务</button>
          <button class="btn primary" id="startBatchBtn" disabled>开始批量生成</button>
        </div>
        <label class="auto-generate"><input type="checkbox" id="autoGenerate" autocomplete="off" aria-describedby="queueHint">加入后自动生成</label>
        <p class="queue-hint" id="queueHint" aria-live="polite">先暂存多条台词，再一起开始生成。</p>
        <div class="gen-status" id="genStatus" role="status">就绪</div>
      </section>

      <details class="advanced-controls">
      <summary>播放音效与统计</summary>
      <section class="card">
        <h3>新片段默认预设</h3>
        <div class="grid-2">
          <div class="field" style="margin-bottom:0">
            <label>设备</label>
            <select id="defSpeaker">
              <option value="raw" selected>RAW 不处理</option>
              <option value="clean">CLEAN 数字</option>
              <option value="radio">RADIO 模拟</option>
              <option value="dirty">DIRTY 老化</option>
              <option value="broken">BROKEN 损坏</option>
              <option value="destroyed">DESTROYED 炸麦</option>
            </select>
          </div>
          <div class="field" style="margin-bottom:0">
            <label>信号</label>
            <select id="defSignal">
              <option value="raw" selected>RAW 不处理</option>
              <option value="strong">STRONG 强</option>
              <option value="normal">NORMAL 正常</option>
              <option value="weak">WEAK 弱</option>
              <option value="critical">CRITICAL 极弱</option>
            </select>
          </div>
        </div>
      </section>

      <section class="card">
        <h3>批量套用</h3>
        <div class="field"><button class="btn small" id="applySpeakerAll">⇉ 设备 套用到全部</button></div>
        <div class="field"><button class="btn small" id="applySignalAll">⇉ 信号 套用到全部</button></div>
        <div class="field" style="margin-bottom:0"><button class="btn small primary" id="applyBothAll">⇉ 设备 + 信号
            都套用</button></div>
      </section>

      <section class="card">
        <h3>角色图例</h3>
        <div id="roleLegend" style="display:flex; flex-wrap:wrap; gap:6px; font-size:11px;"></div>
      </section>

      <section class="card">
        <h3>统计</h3>

    const SIGNAL_PRESETS = {

    function buildP(sp, sg) {
      return Object.assign({}, SPEAKER_PRESETS[sp], { signal: SIGNAL_PRESETS[sg] });
    }

    // ============================================================
    // 角色颜色
    // ============================================================
    // 预定义色相，避开绿色（播放）和黄色（排队）
    const ROLE_HUES = [200, 280, 340, 25, 55, 220, 300, 245, 175, 15, 265, 320];
    const roleColorCache = new Map();

    function roleHue(role) {
      if (roleColorCache.has(role)) return roleColorCache.get(role);
      let h = 0;
      for (let i = 0; i < role.length; i++) h = (h * 137 + role.charCodeAt(i)) >>> 0;
      const hue = ROLE_HUES[h % ROLE_HUES.length];
      roleColorCache.set(role, hue);
      return hue;
    }

    function roleColorVars(role) {
      const hue = roleHue(role);
      return {
        "--role-color": `hsl(${hue}, 65%, 60%)`,
        "--role-fg": `hsl(${hue}, 75%, 72%)`,
        "--role-bg": `hsla(${hue}, 60%, 30%, 0.35)`,
        "--role-border": `hsla(${hue}, 60%, 55%, 0.5)`,
      };
    }

    function applyRoleColorVars(el, role) {
      const vars = roleColorVars(role);
      for (const k in vars) el.style.setProperty(k, vars[k]);
    }

    // ============================================================
    // 全局状态
    // ============================================================
    let ctx = null;
    let P = buildP("raw", "raw");
    let chain = null;
    let source = null;
    let isPlaying = false;

    let noiseTimer = null, dropoutTimer = null, sparkTimer = null,
      squelchTimer = null, endTimer = null;

    const clips = [];
    let clipIdCounter = 0;
    let playlistRunning = false;
    let activeStop = null;
    let dragId = null;
    let singlePlayingId = null;
    let playbackSession = 0;
    let generatorMode = 'clone';
    let libraryLoaded = false;
    let editingClip = null;
    let designCapability = null;
    const selectedClips = new Set();
    const LANGUAGE_NAMES = {Chinese: '中文', English: 'English', Japanese: '日本語', Korean: '한국어', French: 'Français', German: 'Deutsch', Spanish: 'Español', Italian: 'Italiano', Portuguese: 'Português', Russian: 'Русский', Auto: '自动检测'};

    // 角色数据
    let rolesData = {};          // {角色: [情感, ...]}
    let roleList = [];           // 有序的角色数组

    // 队列
    const jobQueue = [];
    const activeJobs = new Map();
    let activeBatches = 0;
    let batchSubmissionSize = 1;
    let parallelRequestLimit = 1;
    let queueTimer = null;
    let inferencePollTimer = null;
    let queueWorkerRunning = false;
    const PENDING_JOBS_KEY = 'qwen3-tts-pending-jobs-v1';

    // ============================================================
    // DOM
    // ============================================================
    const $ = (id) => document.getElementById(id);

    const listEl = $("list");
    const playBtn = $("playBtn");
    const stopBtn = $("stopBtn");
    const clearBtn = $("clearBtn");

    const genEmotion = $("genEmotion");

    const ptHint = $("ptHint");

    const defSpeaker = $("defSpeaker");
    const defSignal = $("defSignal");
    const applySpeakerAll = $("applySpeakerAll");
    const applySignalAll = $("applySignalAll");
    const applyBothAll = $("applyBothAll");

    const statusText = $("statusText");
    const footQueue = $("footQueue");
    const footClips = $("footClips");
    const footReady = $("footReady");
    const statClips = $("statClips");
    const statQueue = $("statQueue");
    const statDuration = $("statDuration");
    const statReady = $("statReady");

    // ============================================================
    // 工具
    // ============================================================
    function ensureCtx() {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      return ctx;
    }

    function makeDistortionCurve(amount) {
      const n = 8192;
      const curve = new Float32Array(n);
      if (amount <= 0.001) {
        for (let i = 0; i < n; i++) curve[i] = (i * 2) / n - 1;
        return curve;
      }
      for (let i = 0; i < n; i++) {
        const x = (i * 2) / n - 1;
        curve[i] = Math.tanh(x * amount);
      }
      return curve;
    }

    function createNoiseBuffer(c, duration) {
      const length = Math.max(1, Math.floor(c.sampleRate * duration));
      const buf = c.createBuffer(1, length, c.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < length; i++) data[i] = Math.random() * 2 - 1;
      return buf;
    }

    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    function setStatus(t) { statusText.textContent = t; }
    function setGenStatus(t, cls = "") {
      genStatus.textContent = t;
      genStatus.className = "gen-status " + cls;
    }

    async function apiRequest(url, options = {}) {
      const response = await fetch(url, options);
      if (!response.ok) {
        const data = await response.json().catch(() => ({}));
        const detail = data.detail;
        throw new Error(typeof detail === 'string' ? detail : detail?.message || JSON.stringify(detail || response.statusText));
      }
      return response;
    }

    function clipMetadata(clip) {
      return {title: clip.title || '', text: clip.text || '', role: clip.role || '',
        emotion: clip.emotion || '平静', language: clip.language || 'Chinese',
        synthesis_mode: clip.synthesis_mode || 'clone', instruct: clip.instruct || '',
        speaker: clip.speaker || 'raw', signal: clip.signal || 'raw', delay: clip.delay || 0,
        position: Math.max(0, clips.indexOf(clip))};
    }

    function saveClip(clip) {
      const metadata = clipMetadata(clip);
      // Serialize edits per record so slower requests cannot overwrite newer input.
      clip.saving = (clip.saving || Promise.resolve()).catch(() => {}).then(async () => {
        if (!clip.serverId) throw new Error('记录尚未保存');
        await apiRequest('/api/clips/' + clip.serverId, {method: 'PATCH',
          headers: {'Content-Type': 'application/json'}, body: JSON.stringify(metadata), keepalive: true});
        clip.saveError = null;
      });
      clip.saving.catch(error => { clip.saveError = error.message; setStatus('保存失败：' + error.message); });
      return clip.saving;
    }

    function applyRecord(clip, record) {
      clip.serverId = record.id;
      clip.url = record.available ? record.url : null;
      clip.duration = record.duration || 0;
      clip.generation_stats = record.generation_stats || null;
      clip.created_at = record.created_at;
      const generated = record.generated || {};
      clip.generatedRole = generated.role ?? clip.role;
      clip.generatedEmotion = generated.emotion ?? clip.emotion;
      clip.generatedText = generated.text ?? clip.text;
      clip.generatedLanguage = generated.language ?? clip.language;
      clip.generatedInstruct = generated.instruct ?? clip.instruct;
      clip.error = record.filename && !record.available ? '音频文件缺失' : null;
    }

    async function loadLibrary() {
      if (queueWorkerRunning || playlistRunning || singlePlayingId !== null) { setStatus('请先完成任务或取消暂存，再刷新语音库'); return; }
      try {
        await Promise.all(clips.map(clip => clip.saveError ? saveClip(clip) : clip.saving));
        const data = await (await apiRequest('/api/clips')).json();
        clips.length = 0;
        selectedClips.clear();
        for (const record of data.clips) {
          const clip = {speaker: 'raw', signal: 'raw', delay: 0, role: '', emotion: '平静',
            language: 'Chinese', instruct: '', ...record, id: ++clipIdCounter, buffer: null};
          applyRecord(clip, record);
          clips.push(clip);
        }
        libraryLoaded = true;
        restorePendingJobs();
        setStatus('本地语音库已同步');
        renderList();
        updateGeneratorMode();
      } catch (error) { setStatus('读取失败：' + error.message); }
    }

    function visibleClips() {
      const query = $('librarySearch').value.trim().toLocaleLowerCase();
      return clips.filter(clip => [clip.title, clip.text, clip.role, clip.instruct].join(' ').toLocaleLowerCase().includes(query));
    }

    function updateSelection() {
      const visible = visibleClips();
      $('selectionCount').textContent = selectedClips.size + ' 项已选';
      $('selectAll').checked = visible.length > 0 && visible.every(clip => selectedClips.has(clip.id));
      $('selectAll').indeterminate = visible.some(clip => selectedClips.has(clip.id)) && !$('selectAll').checked;
      $('exportSelected').disabled = !clips.some(clip => clip.url && selectedClips.has(clip.id));
      $('exportAll').disabled = !clips.some(clip => clip.url);
      $('deleteSelected').disabled = selectedClips.size === 0 || queueWorkerRunning || playlistRunning || singlePlayingId !== null;
    }

    async function exportClips(selectedOnly) {
      const records = clips.filter(clip => clip.url && (!selectedOnly || selectedClips.has(clip.id)));
      if (!records.length) return;
      try {
        await Promise.all(records.map(clip => clip.saving));
        const response = await apiRequest('/api/clips/export', {method: 'POST',
          headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ids: records.map(clip => clip.serverId)})});
        const url = URL.createObjectURL(await response.blob());
        const link = document.createElement('a');
        link.href = url; link.download = 'qwen3-tts-audio.zip'; link.click();
        setTimeout(() => URL.revokeObjectURL(url), 30000);
        setStatus('已导出 ' + records.length + ' 个原始 WAV');
      } catch (error) { setStatus('导出失败：' + error.message); }
    }

    async function loadCapabilities() {
      designCapability = null;
      try {
        const data = await (await apiRequest('/api/capabilities')).json();
        designCapability = data.voice_design;
        batchSubmissionSize = Math.max(1, Math.min(32, data.inference?.max_request_items || 16));
        parallelRequestLimit = data.inference?.mode === 'adaptive_batch' ? 2 : 1;
        updateQueueControls();
        $('designModelStatus').textContent = 'VoiceDesign 1.7B · ' + (designCapability.installed ? '已安装' : designCapability.offline ? '未安装 · 离线模式' : '首次生成需下载模型');
      } catch (error) { $('designModelStatus').textContent = '模型检查失败：' + error.message; }
    }

    function updateGeneratorMode() {
      const design = generatorMode === 'design';
      $('cloneTab').setAttribute('aria-selected', String(!design));
      $('designTab').setAttribute('aria-selected', String(design));
      $('cloneFields').hidden = design;
      $('designFields').hidden = !design;
      genBtn.disabled = !libraryLoaded || (!design && !roleList.length);
      updateQueueControls();
