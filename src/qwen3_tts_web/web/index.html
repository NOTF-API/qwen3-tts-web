      $('editEmotionField').hidden = clip.synthesis_mode === 'design';
      $('editInstruct').value = clip.instruct || '';
      $('editInstructField').hidden = clip.synthesis_mode !== 'design';
      $('editStatus').textContent = '';
      $('editDialog').showModal();
    }

    async function ensureBuffer(clip) {
      if (clip.buffer) return;
      if (!clip.url) throw new Error('音频尚未生成或文件已丢失');
      const response = await apiRequest(clip.url);
      clip.buffer = await ensureCtx().decodeAudioData(await response.arrayBuffer());
      clip.error = null;
    }

    // ============================================================
    // 音效（完整保留）
    // ============================================================
    function applyPreset(p, tc = 0.02) {
      if (!chain || !ctx) return;
      const t = ctx.currentTime;
      const set = (param, value) => param.setTargetAtTime(value, t, tc);

      set(chain.hp.frequency, p.highPassFreq);
      set(chain.lp.frequency, p.lowPassFreq);
      set(chain.comp.threshold, p.compressorThreshold);
      set(chain.comp.ratio, p.compressorRatio);
      set(chain.comp.knee, p.compressorKnee);
      set(chain.comp.attack, p.compressorAttack);
      set(chain.comp.release, p.compressorRelease);
      set(chain.voice.gain, p.voiceVolume);
      set(chain.nFilt.frequency, p.staticFreq);
      set(chain.nFilt.Q, p.staticQ);
      set(chain.nGain.gain, p.staticVolume);
      chain.shaper.curve = makeDistortionCurve(p.distortionAmount);

      if (chain.fadeLfo) set(chain.fadeLfo.frequency, p.signal.fadeRate);
      if (chain.fadeDepthGain) set(chain.fadeDepthGain.gain, p.signal.fadeDepth / 2);
      if (chain.voiceMod) set(chain.voiceMod.gain, 1 - p.signal.fadeDepth / 2);
      if (chain.hetGain) set(chain.hetGain.gain, p.signal.hetVolume);
      if (chain.hetOsc) set(chain.hetOsc.frequency, p.signal.hetFreq);
      if (chain.agcPumpGain) set(chain.agcPumpGain.gain, 1 - p.signal.agcPump * 0.5);
      if (chain.driftLfo) set(chain.driftLfo.frequency, Math.max(0.01, p.signal.driftRate));
      if (chain.driftDetuneGain) set(chain.driftDetuneGain.gain, p.signal.driftDepth * 100);
    }

    function playSquelchBurst() {
      if (!ctx) return;
      if (P.burstPeak <= 0.0001 || P.burstDuration <= 0.001) return;
      const c = ctx;
      const t = c.currentTime + 0.005;
      const dur = P.burstDuration, peak = P.burstPeak;
      const rise = P.burstRise, fall = P.burstFall;
      const hold = Math.max(0.005, dur - rise - fall);
      const src = c.createBufferSource();
      src.buffer = createNoiseBuffer(c, dur + 0.1);
      const bp = c.createBiquadFilter();
      bp.type = "bandpass";
      bp.frequency.value = (P.burstFreqLow + P.burstFreqHigh) / 2;
      bp.Q.value = 0.5 + (P.burstFreqHigh - P.burstFreqLow) / 2000;
      const g = c.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t + rise);
      g.gain.setValueAtTime(peak, t + rise + hold);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(bp).connect(g).connect(c.destination);
      src.start(t); src.stop(t + dur + 0.05);
    }

    function playPttClick() {
      if (!ctx) return;
      const c = ctx;
      const t = c.currentTime;
      const level = P.pttClickLevel;
      if (level <= 0) return;
      const src = c.createBufferSource();
      src.buffer = createNoiseBuffer(c, 0.02);
      const hp = c.createBiquadFilter();
      hp.type = "highpass"; hp.frequency.value = P.pttClickHp;
      const g = c.createGain();
      g.gain.setValueAtTime(level, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.012);
      src.connect(hp).connect(g).connect(c.destination);
      src.start(t); src.stop(t + 0.03);
    }

    function playCrackle() {
      const c = ctx;
      const t = c.currentTime;
      const dest = c.destination;
      const base = P.crackleVolume;
      const r = Math.random();

      if (r < 0.55) {
        const dur = 0.004 + Math.random() * 0.012;
        const amp = base * (0.5 + Math.random() * 1.6);
        const src = c.createBufferSource();
        src.buffer = createNoiseBuffer(c, dur);
        const bp = c.createBiquadFilter();
        bp.type = "bandpass";
        bp.frequency.value = 1800 + Math.random() * 3500;
        bp.Q.value = 2 + Math.random() * 8;
        const g = c.createGain();
        g.gain.setValueAtTime(amp, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        src.connect(bp).connect(g).connect(dest);
        src.start(t); src.stop(t + dur + 0.02);
      } else if (r < 0.82) {
        const dur = 0.018 + Math.random() * 0.035;
        const amp = base * (0.4 + Math.random() * 0.9);
        const src = c.createBufferSource();
        src.buffer = createNoiseBuffer(c, dur);
        const lp = c.createBiquadFilter();
        lp.type = "lowpass";
        lp.frequency.value = 200 + Math.random() * 350;
        const g = c.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(amp, t + 0.004);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        src.connect(lp).connect(g).connect(dest);
        src.start(t); src.stop(t + dur + 0.02);
      } else {
        const dur = 0.05 + Math.random() * 0.13;
        const amp = base * (0.3 + Math.random() * 0.7);
        const src = c.createBufferSource();
        src.buffer = createNoiseBuffer(c, dur);
        const bp = c.createBiquadFilter();
        bp.type = "bandpass";
        bp.frequency.value = 800 + Math.random() * 1400;
        bp.Q.value = 0.6 + Math.random() * 0.9;
        const g = c.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(amp, t + 0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        src.connect(bp).connect(g).connect(dest);
        src.start(t); src.stop(t + dur + 0.02);
      }
    }

    function playSpark() {
      const c = ctx;
      const t = c.currentTime;
      const amp = P.signal.sparkVolume;
      if (amp <= 0) return;
      const dur = 0.003 + Math.random() * 0.01;
      const src = c.createBufferSource();
      src.buffer = createNoiseBuffer(c, dur);
      const bp = c.createBiquadFilter();
      bp.type = "bandpass";
      bp.frequency.value = 2000 + Math.random() * 3000;
      bp.Q.value = 1 + Math.random() * 3;
      const g = c.createGain();
      g.gain.setValueAtTime(amp, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(bp).connect(g).connect(c.destination);
      src.start(t); src.stop(t + dur + 0.02);
    }

    function triggerDropout() {
      if (!ctx || !chain) return;
      const c = ctx;
      const t = c.currentTime;
      const dur = P.signal.dropoutDuration;
      const boost = Math.max(1, P.signal.dropoutNoiseBoost);
      const vg = chain.voiceDropGain.gain;
      const ng = chain.noiseDropGain.gain;
      try {
        vg.cancelScheduledValues(t);
        vg.setValueAtTime(Math.max(0.02, vg.value), t);
        vg.linearRampToValueAtTime(0.02, t + 0.008);
        vg.setValueAtTime(0.02, t + dur - 0.025);
        vg.linearRampToValueAtTime(1, t + dur);
        ng.cancelScheduledValues(t);
        ng.setValueAtTime(Math.max(1, ng.value), t);
        ng.linearRampToValueAtTime(boost, t + 0.008);
        ng.setValueAtTime(boost, t + dur - 0.025);
        ng.linearRampToValueAtTime(1, t + dur);
      } catch (e) { }
    }

    function startRandomNoise() {
      stopRandomNoise();
      const tick = () => {
        if (!isPlaying || !chain) return;
        const rate = Math.max(0.05, P.crackleRate);
        const delay = (-Math.log(1 - Math.random()) / rate) * 1000;
        noiseTimer = setTimeout(() => {
          if (!isPlaying || !chain) return;
          playCrackle(); tick();
        }, delay);
      };
      tick();
    }
    function stopRandomNoise() { clearTimeout(noiseTimer); noiseTimer = null; }

    function startSignalDegradation() {
      stopSignalDegradation();
      const tickDropout = () => {
        if (!isPlaying || !chain) return;
        const rate = P.signal.dropoutRate;
        if (rate <= 0) { dropoutTimer = setTimeout(tickDropout, 500); return; }
        const delay = (-Math.log(1 - Math.random()) / rate) * 1000;
        dropoutTimer = setTimeout(() => {
          if (!isPlaying || !chain) return;
          triggerDropout(); tickDropout();
        }, delay);
      };
      const tickSpark = () => {
        if (!isPlaying || !chain) return;
        const rate = P.signal.sparkRate;
        if (rate <= 0) { sparkTimer = setTimeout(tickSpark, 500); return; }
        const delay = (-Math.log(1 - Math.random()) / rate) * 1000;
        sparkTimer = setTimeout(() => {
          if (!isPlaying || !chain) return;
          playSpark(); tickSpark();
        }, delay);
      };
      tickDropout(); tickSpark();
    }
    function stopSignalDegradation() {
      clearTimeout(dropoutTimer); clearTimeout(sparkTimer);
      dropoutTimer = null; sparkTimer = null;
    }

    function startSquelchGate() {
      stopSquelchGate();
      if (!chain || !ctx) return;
      if (P.signal.squelchThreshold <= 0) return;
      const analyser = chain.analyser;
      const dataArray = new Uint8Array(analyser.frequencyBinCount);
      let gateOpen = false;
      const tick = () => {
        if (!isPlaying || !chain || !analyser) return;
        analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
        const energy = sum / dataArray.length;
        const openThreshold = P.signal.squelchThreshold + P.signal.squelchHysteresis;
        const closeThreshold = P.signal.squelchThreshold - P.signal.squelchHysteresis;
        const c = ctx;
        const t = c.currentTime;
        const vg = chain.voiceDropGain.gain;
        const ng = chain.noiseDropGain.gain;
        if (!gateOpen && energy > openThreshold) {
          gateOpen = true;
          try {
            vg.cancelScheduledValues(t);
            vg.setTargetAtTime(1, t, P.signal.squelchAttack);
            ng.cancelScheduledValues(t);
            ng.setTargetAtTime(P.signal.squelchNoiseOpen, t, P.signal.squelchAttack);
          } catch (e) { }
        } else if (gateOpen && energy < closeThreshold) {
          gateOpen = false;
          try {
            vg.cancelScheduledValues(t);
            vg.setTargetAtTime(P.signal.squelchFloor, t, P.signal.squelchRelease);
            ng.cancelScheduledValues(t);
            ng.setTargetAtTime(P.signal.squelchNoiseClosed, t, P.signal.squelchRelease);
          } catch (e) { }
        }
        squelchTimer = setTimeout(tick, 25);
      };
      tick();
    }
    function stopSquelchGate() { clearTimeout(squelchTimer); squelchTimer = null; }

    // ============================================================
    // 播放单条
    // ============================================================
    function playClipAsync(clip) {
      return new Promise((resolve) => {
        if (!clip || !clip.buffer) { resolve(); return; }
        const c = ensureCtx();
        if (c.state === "suspended") c.resume();
        P = buildP(clip.speaker, clip.signal);

        let resolved = false;
        function finish() {
          if (resolved) return;
          resolved = true;
          activeStop = null;
          resolve();
        }
        activeStop = () => {
          if (source) { source.onended = null; try { source.stop(); } catch (e) { } }
          clearTimeout(endTimer);
          isPlaying = false;
          stopRandomNoise(); stopSignalDegradation(); stopSquelchGate();
          killChain(); finish();
        };

        const t0 = c.currentTime + 0.02;
        const src = c.createBufferSource();
        src.buffer = clip.buffer;

        const hp = c.createBiquadFilter(); hp.type = "highpass";
        const lp = c.createBiquadFilter(); lp.type = "lowpass";
        const comp = c.createDynamicsCompressor();
        const shaper = c.createWaveShaper(); shaper.oversample = "2x";
        const voice = c.createGain();

        const voiceMod = c.createGain();
        voiceMod.gain.value = 1 - P.signal.fadeDepth / 2;

        const agcPumpGain = c.createGain();
        agcPumpGain.gain.value = 1 - P.signal.agcPump * 0.5;

        const voiceDropGain = c.createGain();
        voiceDropGain.gain.value = 1;

        const fadeLfo = c.createOscillator();
        fadeLfo.type = "sine";
        fadeLfo.frequency.value = P.signal.fadeRate;
        const fadeDepthGain = c.createGain();
        fadeDepthGain.gain.value = P.signal.fadeDepth / 2;
        fadeLfo.connect(fadeDepthGain).connect(voiceMod.gain);

        const driftLfo = c.createOscillator();
        driftLfo.type = "sine";
        driftLfo.frequency.value = Math.max(0.01, P.signal.driftRate);
        const driftDetuneGain = c.createGain();
        driftDetuneGain.gain.value = P.signal.driftDepth * 100;
        driftLfo.connect(driftDetuneGain).connect(src.detune);

        const hetOsc = c.createOscillator();
        hetOsc.type = "sine";
        hetOsc.frequency.value = P.signal.hetFreq;
        const hetGain = c.createGain();
        hetGain.gain.value = P.signal.hetVolume;
        hetOsc.connect(hetGain).connect(c.destination);

        src.connect(hp).connect(lp).connect(comp).connect(shaper).connect(voice);
        voice.connect(voiceMod).connect(agcPumpGain).connect(voiceDropGain).connect(c.destination);

        const analyser = c.createAnalyser();
        analyser.fftSize = 256;
        analyser.smoothingTimeConstant = 0.3;
        voiceDropGain.connect(analyser);

        const nSrc = c.createBufferSource();
        nSrc.buffer = createNoiseBuffer(c, 0.5);
        nSrc.loop = true;

        const nFilt = c.createBiquadFilter(); nFilt.type = "bandpass";
        const nGain = c.createGain(); nGain.gain.value = 0;
        const noiseDropGain = c.createGain(); noiseDropGain.gain.value = 1;

        nSrc.connect(nFilt).connect(nGain).connect(noiseDropGain).connect(c.destination);

        chain = {
          src, hp, lp, comp, shaper, voice,
          voiceMod, agcPumpGain, voiceDropGain,
          fadeLfo, fadeDepthGain,
          driftLfo, driftDetuneGain,
          hetOsc, hetGain,
          nSrc, nFilt, nGain, noiseDropGain,
          analyser
        };
        applyPreset(P, 0.03);

        nSrc.start(t0);
        fadeLfo.start(t0);
        driftLfo.start(t0);
        hetOsc.start(t0);

        playPttClick();
        playSquelchBurst();

        const voiceStart = t0 + P.burstDuration * P.voiceStartRatio;
        src.start(voiceStart);

        source = src;
        isPlaying = true;
        startRandomNoise(); startSignalDegradation(); startSquelchGate();

        src.onended = () => {
          if (source !== src) return;
          source = null; isPlaying = false;
          stopRandomNoise(); stopSignalDegradation(); stopSquelchGate();
          if (chain) {
            const t = c.currentTime;
            try {
              chain.nGain.gain.cancelScheduledValues(t);
              chain.nGain.gain.setTargetAtTime(0.0001, t, 0.02);
            } catch (e) { }
          }
          playSquelchBurst();
          playPttClick();
          endTimer = setTimeout(() => { killChain(); finish(); }, P.burstDuration * 1000 + 80);
        };
      });
    }

    function killChain() {
      stopRandomNoise(); stopSignalDegradation(); stopSquelchGate();
      if (!chain || !ctx) { chain = null; return; }
      const t = ctx.currentTime;
      try {
        chain.nGain.gain.cancelScheduledValues(t);
        chain.nGain.gain.setTargetAtTime(0.0001, t, 0.015);
      } catch (e) { }
      try { chain.nSrc.stop(t + 0.1); } catch (e) { }
      try { chain.fadeLfo.stop(t + 0.05); } catch (e) { }
      try { chain.driftLfo.stop(t + 0.05); } catch (e) { }
      try { chain.hetOsc.stop(t + 0.05); } catch (e) { }
      chain = null;
    }

    // ============================================================
    // 队列
    // ============================================================
    function enqueueJob(job) {
      if (activeJobs.has(job.clipId) || jobQueue.some(item => item.clipId === job.clipId)) return;
      const clip = clips.find(c => c.id === job.clipId);
      if (!clip) return;
      clip.queued = true;
      clip.error = null;
      clip.inferenceLabel = null;
      jobQueue.push({...job, released: autoGenerate.checked});
      persistPendingJobs();
      renderList();
      processQueue();
    }

    function startBatch() {
      const staged = jobQueue.filter(job => !job.released);
      if (!staged.length) return;
      // Release only this snapshot. Later additions still need a new click.
      staged.forEach(job => { job.released = true; });
      renderList();
      setGenStatus(`已开始 ${staged.length} 条任务`, 'ok');
      processQueue();
    }

    function changeAutoGenerate() {
      if (autoGenerate.checked) startBatch();
      renderList();
      setGenStatus(autoGenerate.checked ? '已开启自动生成' : '已切换为暂存，已开始的任务会继续', 'ok');
    }

    function cancelStagedJob(clipId) {
      const index = jobQueue.findIndex(job => job.clipId === clipId && !job.released);
      if (index < 0) return;
      jobQueue.splice(index, 1);
      const clip = clips.find(c => c.id === clipId);
      if (clip) clip.queued = false;
      persistPendingJobs();
      renderList();
      setStatus('已取消暂存，台词仍保留在语音库，可编辑后重新暂存');
    }

    function persistPendingJobs() {
      try {
        // Only store references to saved drafts. Submitted requests are never
        // restored, so refreshing cannot accidentally generate them twice.
        const pending = jobQueue.map(job => ({
          serverId: clips.find(c => c.id === job.clipId)?.serverId,
          allow_download: job.allow_download === true,
        })).filter(item => item.serverId);
        if (pending.length) sessionStorage.setItem(PENDING_JOBS_KEY, JSON.stringify(pending));
        else sessionStorage.removeItem(PENDING_JOBS_KEY);
        queuePersistenceAvailable = true;
      } catch (error) { queuePersistenceAvailable = false; }
    }

    function restorePendingJobs() {
      try {
        const pending = JSON.parse(sessionStorage.getItem(PENDING_JOBS_KEY) || '[]');
        if (!Array.isArray(pending)) return;
        for (const item of pending) {
          const clip = clips.find(c => c.serverId === item?.serverId);
          if (!clip || !clip.text?.trim() || jobQueue.some(job => job.clipId === clip.id)) continue;
          clip.queued = true;
          jobQueue.push({clipId: clip.id, role: clip.role, emotion: clip.emotion,
            text: clip.text.trim(), language: clip.language, instruct: clip.instruct,
            synthesis_mode: clip.synthesis_mode, allow_download: item.allow_download === true,
            released: false});
        }
        persistPendingJobs();
      } catch (error) { queuePersistenceAvailable = false; }
    }

    function updateQueueControls() {
      const staged = jobQueue.filter(job => !job.released).length;
      const running = activeJobs.size + jobQueue.length - staged;
      genBtn.textContent = autoGenerate.checked ? '+ 加入生成队列' : '+ 暂存任务';
      genBtn.classList.toggle('primary', autoGenerate.checked);
      startBatchBtn.hidden = autoGenerate.checked;
      startBatchBtn.disabled = staged === 0;
      startBatchBtn.textContent = staged ? `开始批量生成（${staged}）` : '开始批量生成';
      queueHint.textContent = autoGenerate.checked ? '新增任务会立即进入生成队列。' :
        staged ? `已暂存 ${staged} 条，点击开始后统一提交。` :
        running ? '本批正在生成，可继续暂存下一批。' : '先暂存多条台词，再一起开始生成。';
      if (staged && running) queueHint.textContent += ' 当前批次继续生成。';
      if (!queuePersistenceAvailable) queueHint.textContent += ' 浏览器无法保存暂存队列，请勿刷新页面。';
    }

    function updateStats() {
      const pending = jobQueue.length + activeJobs.size;
      const staged = jobQueue.filter(job => !job.released).length;
      queueWorkerRunning = pending > 0;
      updateQueueControls();
      const ready = clips.filter(c => c.url).length;
      const total = clips.reduce((s, c) => s + (c.duration || 0), 0);

      statClips.textContent = clips.length;
      statQueue.textContent = pending;
      statDuration.textContent = total.toFixed(2) + "s";
      statReady.textContent = ready;

      footQueue.textContent = pending;
      footClips.textContent = clips.length;
      footReady.textContent = ready;

      if (pending > 0) {
        const generating = clips.filter(c => c.generating).length;
        const running = pending - staged;
        queueIndicator.textContent = [running ? `生成 ${generating} · 待完成 ${running}` : '',
          staged ? `暂存 ${staged}` : ''].filter(Boolean).join(' · ');
        queueIndicator.classList.add("on");
      } else {
        queueIndicator.classList.remove("on");
      }

      playBtn.disabled = playlistRunning || singlePlayingId !== null || ready === 0;
      stopBtn.disabled = !playlistRunning && singlePlayingId === null;
      clearBtn.disabled = playlistRunning || singlePlayingId !== null || queueWorkerRunning || clips.length === 0;
      updateSelection();
    }

    function processQueue() {
      if (queueTimer !== null || !jobQueue.some(job => job.released) || activeBatches >= parallelRequestLimit) return;
      // Two HTTP requests can carry many jobs without occupying all browser
      // connections. Actual GPU batch admission belongs to the server.
      queueTimer = setTimeout(() => {
        queueTimer = null;
        while (jobQueue.some(job => job.released) && activeBatches < parallelRequestLimit) {
          const jobs = jobQueue.filter(job => job.released).slice(0, batchSubmissionSize);
          for (const job of jobs) jobQueue.splice(jobQueue.indexOf(job), 1);
          persistPendingJobs();
          jobs.forEach(job => activeJobs.set(job.clipId, job));
          activeBatches++;
          runJobs(jobs).finally(() => {
            jobs.forEach(job => activeJobs.delete(job.clipId));
            activeBatches--;
            renderList();
            processQueue();
          });
        }
        updateStats();
        pollInference();
      }, 80);
    }

    function jobFailed(job, error) {
      const clip = clips.find(c => c.id === job.clipId);
      if (clip) { clip.generating = false; clip.queued = false; clip.inferenceLabel = null; clip.error = error.message; }
    }

    async function runJobs(jobs) {
      let ready = [];
      try {
        const prepared = await Promise.all(jobs.map(async job => {
          const clip = clips.find(c => c.id === job.clipId);
          if (!clip) return null;
          try {
            await clip.saving;
            return {job, clip, payload: {
              synthesis_mode: job.synthesis_mode === 'design' ? 'design' : 'clone',
              role: job.role, emotion: job.emotion, text: job.text,
              language: job.language, mode: 'url', instruct: job.instruct || '',
              clip_id: clip.serverId, allow_download: job.allow_download || false,
            }};
          } catch (error) { jobFailed(job, error); return null; }
        }));
        ready = prepared.filter(Boolean);
        if (!ready.length) return;
        setStatus(`已提交 ${ready.length} 条，按可用显存自动安排生成`);
        const submittedAt = performance.now();
        const response = await apiRequest('/api/generate-batch', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({items: ready.map(item => item.payload)}),
        });
        const data = await response.json();
        if (!Array.isArray(data.items) || data.items.length !== ready.length) throw new Error('批次返回数量不匹配，请刷新语音库确认结果');
        let failed = 0;
        data.items.forEach((result, index) => {
          const {job, clip} = ready[index];
          if (result.status === 'ok') {
            applyRecord(clip, result.result.clip);
            clip.buffer = null; clip.generating = false; clip.queued = false; clip.inferenceLabel = null; clip.error = null;
          } else {
            failed++;
            const detail = result.detail;
            jobFailed(job, new Error(typeof detail === 'string' ? detail : detail?.message || JSON.stringify(detail)));
          }
        });
        const elapsed = ((performance.now() - submittedAt) / 1000).toFixed(1);
        setStatus(`本次提交已保存 ${ready.length - failed} 条，共耗时 ${elapsed} 秒（含排队与保存）` + (failed ? `，${failed} 条失败，可单独重试` : ''));
        if (ready.some(item => item.job.synthesis_mode === 'design')) loadCapabilities();
      } catch (error) {
        ready.forEach(({job}) => jobFailed(job, error));
        setStatus('生成失败：' + error.message);
      }
    }

    function inferenceLabel(state, clipId) {
      if ((state.active_clip_ids || []).includes(clipId)) {
        if (state.active_phase === 'preparing') return '准备模型';
        if (state.active_phase === 'calibrating') return '单条生成 · 测量显存';
        const elapsed = Math.floor(state.active_elapsed_seconds || 0);
        return (state.active > 1 ? `同批 ${state.active} 条 · ` : '') + `生成中 ${elapsed}s`;
      }
      if ((state.queued_clip_ids || []).includes(clipId)) {
        return state.active_phase === 'calibrating' ? '等待显存测量' : '排队等待';
      }
      return '等待本批结果';
    }

    function generationTimeLabel(clip) {
      const stats = clip.generation_stats;
      if (!stats || !Number.isFinite(stats.batch_seconds)) return '';
      return (stats.batch_size > 1 ? `同批 ${stats.batch_size} 条推理 ` : '单条推理 ') +
        stats.batch_seconds.toFixed(2) + 's';
    }

    async function pollInference() {
      if (inferencePollTimer !== null) return;
      // Use a sentinel while fetching so several submitters cannot start polls.
      inferencePollTimer = -1;
      try {
        if (!activeJobs.size) return;
        const state = await (await apiRequest('/api/inference/status')).json();
        const running = new Set(state.active_clip_ids || []);
        activeJobs.forEach(job => {
          const clip = clips.find(c => c.id === job.clipId);
          if (!clip || (!clip.queued && !clip.generating)) return;
          clip.generating = running.has(clip.serverId);
          clip.queued = !clip.generating;
          clip.inferenceLabel = inferenceLabel(state, clip.serverId);
          // Do not rebuild editable rows on each poll and steal keyboard focus.
          const row = listEl.querySelector(`.clip-row[data-id="${clip.id}"]`);
          if (row) {
            row.classList.toggle('generating', clip.generating);
            row.classList.toggle('queued', clip.queued);
            const badge = row.querySelector('.row-badge');
            if (badge) badge.textContent = clip.inferenceLabel;
          }
        });
        updateStats();
      } catch (error) { /* Transient status errors must not cancel generation. */ }
      finally {
        inferencePollTimer = activeJobs.size ? setTimeout(() => {
          inferencePollTimer = null;
          pollInference();
        }, 1000) : null;
      }
    }

    // ============================================================
    // 播放调度
    // ============================================================
    async function runPlaylist() {
      if (playlistRunning) return;
      const playable = clips.filter(c => c.url);
      if (playable.length === 0) return;

      if (singlePlayingId !== null && activeStop) {
        activeStop(); activeStop = null; singlePlayingId = null;
      }

      const session = ++playbackSession;
      // Resume inside the user gesture; decoding is no longer a generation prerequisite.
      const resumed = ensureCtx().resume();
      playlistRunning = true;
      updateStats();
      renderList();

      try {
      await resumed;
      for (let i = 0; i < playable.length; i++) {
        if (session !== playbackSession) break;
        const clip = playable[i];

        singlePlayingId = clip.id;
        renderList();

        try {
          await ensureBuffer(clip);
          if (session !== playbackSession) break;
          await playClipAsync(clip);
        } catch (e) {
          clip.error = '播放失败：' + e.message;
          setStatus(clip.error);
        }
        if (session !== playbackSession) break;
        singlePlayingId = null;

        if (!playlistRunning) break;

        if (i < playable.length - 1 && clip.delay > 0) {
          setStatus(`等待 ${clip.delay.toFixed(2)}s`);
          await sleep(clip.delay * 1000);
        }
      }
      } catch (error) { setStatus('播放失败：' + error.message); }
      if (session !== playbackSession) return;
      playlistRunning = false;
      singlePlayingId = null;
      renderList();
      updateStats();
      setStatus(playable.some(clip => clip.error) ? '播放结束，部分音频加载失败，可重试' : '播放完成');
    }

    function stopPlaylist() {
      if (!playlistRunning && singlePlayingId === null) return;
      ++playbackSession;
      playlistRunning = false;
      if (activeStop) { activeStop(); activeStop = null; }
      singlePlayingId = null;
      renderList();
      updateStats();
      setStatus("已停止");
    }

    async function playSingle(clip) {
      if (singlePlayingId === clip.id) {
        stopPlaylist();
        return;
      }
      if (playlistRunning) stopPlaylist();
      if (singlePlayingId !== null && activeStop) {
        activeStop(); activeStop = null;
      }
      if (!clip.url) return;
      const session = ++playbackSession;
      const resumed = ensureCtx().resume();

      singlePlayingId = clip.id;
      renderList(); updateStats();
      setStatus(`播放 #${clip.id} ${clip.role}/${clip.emotion}`);

      try {
        await resumed;
        await ensureBuffer(clip);
        if (session !== playbackSession) return;
        await playClipAsync(clip);
      } catch (e) { clip.error = '播放失败：' + e.message; setStatus(clip.error); }

      if (session === playbackSession) {
        singlePlayingId = null;
        renderList(); updateStats();
        setStatus(clip.error || '就绪');
      }
    }

    // ============================================================
    // 列表渲染
    // ============================================================
    function isDirty(clip) {
      if (!clip.url || clip.synthesis_mode === 'legacy') return false;
      return clip.role !== clip.generatedRole
        || clip.emotion !== clip.generatedEmotion
        || clip.text !== clip.generatedText
        || clip.language !== clip.generatedLanguage
        || clip.instruct !== clip.generatedInstruct;
    }

    function renderList() {
      if (clips.length === 0) {
        listEl.innerHTML = '<div class="empty"><b>暂无语音</b></div>';
        updateStats();
        return;
      }
      listEl.innerHTML = "";
      const visible = visibleClips();
      visible.forEach((clip, idx) => listEl.appendChild(buildRow(clip, idx)));
      if (!visible.length) listEl.innerHTML = '<div class="empty"><b>没有匹配的语音</b></div>';
      updateStats();
    }

    function buildRow(clip, idx) {
      const row = document.createElement("div");
      row.className = "clip-row";
      row.dataset.id = clip.id;
      applyRoleColorVars(row, clip.role);

      if (clip.generating) row.classList.add("generating");
      else if (clip.queued) row.classList.add("queued");
      else if (clip.id === singlePlayingId) row.classList.add("playing");
      if (isDirty(clip) && !clip.generating && !clip.queued) row.classList.add("dirty");

      const busy = playlistRunning || singlePlayingId !== null;
      const locked = busy || clip.generating || clip.queued;
      const staged = jobQueue.some(job => job.clipId === clip.id && !job.released);
      const design = clip.synthesis_mode === 'design';
      const legacy = clip.synthesis_mode === 'legacy';

      // ---- grip ----
      const grip = document.createElement("span");
      grip.className = "grip";
      grip.textContent = "⠿";
      grip.title = busy ? "播放中不可拖动" : "拖动排序";
      grip.draggable = !busy && !$('librarySearch').value.trim();
      grip.setAttribute("aria-disabled", String(busy));
      grip.addEventListener("dragstart", (e) => {
        if (!grip.draggable) { e.preventDefault(); return; }
        dragId = clip.id;
        row.classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", String(clip.id));
        try { e.dataTransfer.setDragImage(row, 20, 20); } catch (_) { }
      });
      grip.addEventListener("dragend", () => {
        row.classList.remove("dragging");
        document.querySelectorAll(".clip-row").forEach(el => el.classList.remove("drop-target"));
        syncOrderFromDOM();
        dragId = null;
        renderList();
      });

      // ---- idx ----
      const idxEl = document.createElement("input");
      idxEl.type = 'checkbox';
      idxEl.className = "idx";
      idxEl.setAttribute('aria-label', '选择语音 ' + (clip.title || idx + 1));
      idxEl.checked = selectedClips.has(clip.id);
      idxEl.addEventListener('change', () => {
        if (idxEl.checked) selectedClips.add(clip.id); else selectedClips.delete(clip.id);
        updateSelection();
      });

      // ---- 角色 ----
      const roleEl = document.createElement("select");
      roleEl.className = "cell-select role-select";
      const allRoles = roleList.slice();
      if (clip.role && !allRoles.includes(clip.role)) allRoles.push(clip.role);
      if (allRoles.length === 0) {
        const o = document.createElement("option");
        o.value = ""; o.textContent = "(无角色)";
        roleEl.appendChild(o);
      } else {
        allRoles.forEach(r => {
          const o = document.createElement("option");
          o.value = r; o.textContent = r;
          if (r === clip.role) o.selected = true;
          roleEl.appendChild(o);
        });
      }
      if (design || legacy) {
        roleEl.replaceChildren(new Option(design ? '描述音色' : '历史音频', ''));
        roleEl.classList.add('design-label');
      }
      roleEl.disabled = locked || design || legacy;
      roleEl.addEventListener("change", () => {
        clip.role = roleEl.value;
        fillEmotionOptions(emoOptions, clip.role);
        applyRoleColorVars(row, clip.role);
        refreshRowDirtyState(row, clip, textEl, regenIco);
      });

      // ---- 情感 ----
      const emoEl = document.createElement("input");
      emoEl.type = 'text';
      emoEl.className = "cell-input emo-select";
      emoEl.setAttribute('aria-label', '情绪');
      emoEl.placeholder = '默认 · 平静';
      emoEl.maxLength = 30;
      emoEl.autocomplete = 'off';
      emoEl.value = clip.emotion || '';
      const emoOptions = document.createElement('datalist');
      emoOptions.id = 'emotion-options-' + clip.id;
      emoEl.setAttribute('list', emoOptions.id);
      fillEmotionOptions(emoOptions, clip.role);
      emoEl.disabled = locked || design;
      emoEl.addEventListener("change", () => {
        clip.emotion = emoEl.value.trim() || '平静';
        emoEl.value = clip.emotion;
        refreshRowDirtyState(row, clip, textEl, regenIco);
      });

      // ---- 文本 ----
      const textEl = document.createElement("input");
      textEl.type = "text";
      textEl.className = "cell-input text-cell";
      textEl.value = clip.text || "";
      textEl.title = clip.text || "";
      if (isDirty(clip)) textEl.classList.add("changed");
      textEl.disabled = busy || clip.generating || clip.queued;
      textEl.addEventListener("input", () => {
        clip.text = textEl.value;
        refreshRowDirtyState(row, clip, textEl, regenIco);
      });
      const info = document.createElement('div');
      info.className = 'clip-info';
      const title = document.createElement('button');
      title.className = 'clip-title';
      title.textContent = clip.title || '未命名语音';
      title.title = '编辑名称与生成参数';
      title.disabled = locked;
      title.onclick = () => openEdit(clip);
      const meta = document.createElement('div');
      meta.className = 'clip-meta' + (clip.error ? ' clip-error' : '');
      meta.textContent = clip.error || [LANGUAGE_NAMES[clip.language] || clip.language,
        clip.url ? '音频时长 ' + clip.duration.toFixed(2) + 's' : '未生成',
        clip.url ? generationTimeLabel(clip) : '',
        isDirty(clip) ? '参数已修改 · 待重新生成' : clip.url ? '已保存' : '',
        clip.created_at ? new Date(clip.created_at).toLocaleString() : ''].filter(Boolean).join(' · ');
      info.append(title, textEl, meta);

      // ---- 设备 ----
      const spEl = document.createElement("select");
      spEl.className = "cell-select speaker-cell";
      spEl.setAttribute('aria-label', '播放设备音效');
      for (const k of Object.keys(SPEAKER_PRESETS)) {
        const o = document.createElement("option");
        o.value = k; o.textContent = k.toUpperCase();
        if (k === clip.speaker) o.selected = true;
        spEl.appendChild(o);
      }
      spEl.disabled = busy;
      spEl.addEventListener("change", () => { clip.speaker = spEl.value; saveClip(clip); });

      // ---- 信号 ----
      const sgEl = document.createElement("select");
      sgEl.className = "cell-select signal-cell";
      sgEl.setAttribute('aria-label', '播放信号音效');
      for (const k of Object.keys(SIGNAL_PRESETS)) {
        const o = document.createElement("option");
        o.value = k; o.textContent = k.toUpperCase();
        if (k === clip.signal) o.selected = true;
        sgEl.appendChild(o);
      }
      sgEl.disabled = busy;
      sgEl.addEventListener("change", () => { clip.signal = sgEl.value; saveClip(clip); });

      // ---- 延迟 ----
      const dWrap = document.createElement("div");
      dWrap.className = "delay-wrap";
      const dEl = document.createElement("input");
      dEl.type = "number";
      dEl.setAttribute('aria-label', '播放后延迟秒数');
      dEl.className = "cell-input";
      dEl.min = "0"; dEl.step = "0.1";
      dEl.value = clip.delay;
      dEl.disabled = busy;
      dEl.addEventListener("input", () => { clip.delay = Math.max(0, parseFloat(dEl.value) || 0); });
      dEl.addEventListener("blur", () => { dEl.value = clip.delay; saveClip(clip); });
      dWrap.appendChild(dEl);

      // ---- ▶ ----
      const playIco = document.createElement("button");
      const isThis = clip.id === singlePlayingId;
      playIco.className = "icon-btn play" + (isThis ? " active" : "");
      playIco.textContent = isThis ? "■" : "▶";
      playIco.title = isThis ? "停止" : "播放此条";
      playIco.disabled = !clip.url || playlistRunning;
      playIco.addEventListener("click", () => playSingle(clip));

      // ---- ↻ ----
      const regenIco = document.createElement("button");
      regenIco.className = "icon-btn regen" + (isDirty(clip) ? " hot" : "");
      regenIco.textContent = staged ? '↩' : '↻';
      regenIco.title = staged ? '取消暂存（保留台词）' : autoGenerate.checked ? '重新生成' : '暂存生成任务';
      regenIco.setAttribute('aria-label', regenIco.title);
      regenIco.disabled = (staged ? busy : locked) || legacy;
      regenIco.addEventListener("click", async () => {
        if (staged) { cancelStagedJob(clip.id); return; }
        const t = (clip.text || "").trim();
        if (!t) { setStatus("文本不能为空"); return; }
        if (!design && !clip.role) { setStatus("未选择角色"); return; }
        if (design && !clip.instruct.trim()) { setStatus('请填写音色描述'); return; }
        const consent = await designDownloadConsent(design);
        if (consent === null) return;
        clip.emotion = clip.emotion || "平静";
        clip.error = null;
        clip.queued = true;
        renderList();
        enqueueJob({
          clipId: clip.id,
          role: clip.role,
          emotion: clip.emotion,
          text: t,
          language: clip.language,
          synthesis_mode: clip.synthesis_mode,
          instruct: clip.instruct,
          allow_download: consent,
        });
        setStatus(autoGenerate.checked ? '已加入生成队列' : '已暂存，点击“开始批量生成”后生成');
      });

      // ---- × ----
      const delIco = document.createElement("button");
      delIco.className = "icon-btn del";
      delIco.textContent = "×";
      delIco.title = "删除";
      delIco.disabled = locked;
      delIco.addEventListener("click", () => removeClip(clip.id));
      const editIco = document.createElement('button');
      editIco.className = 'icon-btn edit'; editIco.textContent = '✎';
      editIco.title = '编辑语音'; editIco.disabled = locked;
      editIco.onclick = () => openEdit(clip);
      const downloadIco = document.createElement('button');
      downloadIco.className = 'icon-btn download'; downloadIco.textContent = '↓';
      downloadIco.title = '导出原始 WAV'; downloadIco.disabled = !clip.url;
      downloadIco.onclick = () => {
        const link = document.createElement('a');
        link.href = '/api/clips/' + clip.serverId + '/download'; link.click();
      };

      // ---- 角标 ----
      const badge = document.createElement("span");
      badge.className = "row-badge";
      if (clip.generating) badge.textContent = clip.inferenceLabel || "生成中";
      else if (clip.queued) {
        const pos = jobQueue.findIndex(j => j.clipId === clip.id);
        badge.textContent = staged ? '已暂存' : clip.inferenceLabel || (pos >= 0 ? "排队 #" + (pos + 1) : "排队");
      }

      row.appendChild(grip);
      row.appendChild(idxEl);
      row.appendChild(roleEl);
      if (design) {
        const prompt = document.createElement('input');
        prompt.type = 'text';
        prompt.className = 'cell-input design-label prompt-cell';
        prompt.setAttribute('aria-label', '音色描述');
        prompt.value = clip.instruct || '';
        prompt.maxLength = 2000;
        prompt.title = clip.instruct; prompt.disabled = locked;
        prompt.addEventListener('change', () => {
          clip.instruct = prompt.value.trim();
          prompt.title = clip.instruct;
          refreshRowDirtyState(row, clip, textEl, regenIco);
        });
        row.appendChild(prompt);
      } else {
        row.appendChild(emoEl);
        row.appendChild(emoOptions);
      }
      row.appendChild(info);
      row.appendChild(spEl);
      row.appendChild(sgEl);
      row.appendChild(dWrap);
      row.appendChild(playIco);
      row.appendChild(regenIco);
      row.appendChild(editIco);
      row.appendChild(downloadIco);
      row.appendChild(delIco);
      row.appendChild(badge);

      return row;
    }

    function refreshRowDirtyState(row, clip, textEl, regenIco) {
      const d = isDirty(clip);
      textEl.classList.toggle("changed", d);
      row.classList.toggle("dirty", d && !clip.generating && !clip.queued);
      regenIco.classList.toggle("hot", d);
      saveClip(clip);
    }

    function fillEmotionOptions(list, role) {
      list.replaceChildren(...(rolesData[role] || []).map(emotion => new Option(emotion, emotion)));
    }

    // ============================================================
    // 拖拽排序
    // ============================================================
    listEl.addEventListener("dragover", (e) => {
      if (!dragId) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      const targetRow = e.target.closest(".clip-row");
      if (!targetRow) return;
      const draggingEl = listEl.querySelector(".clip-row.dragging");
      if (!draggingEl || draggingEl === targetRow) return;
      const rect = targetRow.getBoundingClientRect();
      const mid = rect.top + rect.height / 2;
      if (e.clientY < mid) listEl.insertBefore(draggingEl, targetRow);
      else listEl.insertBefore(draggingEl, targetRow.nextSibling);
      document.querySelectorAll(".clip-row").forEach(el => el.classList.remove("drop-target"));
      targetRow.classList.add("drop-target");
    });
    listEl.addEventListener("drop", (e) => { if (dragId) e.preventDefault(); });

    function syncOrderFromDOM() {
      if ($('librarySearch').value.trim()) return;
      const ids = Array.from(listEl.querySelectorAll(".clip-row")).map(el => parseInt(el.dataset.id, 10));
      const sorted = [];
      for (const id of ids) {
        const c = clips.find(x => x.id === id);
        if (c) sorted.push(c);
      }
      clips.length = 0;
      clips.push(...sorted);
      clips.forEach(clip => saveClip(clip));
    }

    // ============================================================
    // 增删
    // ============================================================
    async function removeClip(id, confirmed = false) {
      const busy = playlistRunning || singlePlayingId !== null;
      if (busy) return;
      const clip = clips.find(c => c.id === id);
      if (!clip || clip.generating || clip.queued) return;
      if (!confirmed && !confirm('永久删除这条记录及其本地音频文件？')) return;
      try {
        await clip.saving?.catch(() => {});
        await apiRequest('/api/clips/' + clip.serverId, {method: 'DELETE'});
      } catch (error) { setStatus('删除失败：' + error.message); return; }
      if (singlePlayingId === id && activeStop) { activeStop(); activeStop = null; singlePlayingId = null; }
      const i = clips.findIndex(c => c.id === id);
      if (i >= 0) clips.splice(i, 1);
      const qi = jobQueue.findIndex(j => j.clipId === id);
      if (qi >= 0) jobQueue.splice(qi, 1);
      selectedClips.delete(id);
      renderList();
      setStatus("已删除");
    }

    async function clearAll(selectedOnly = false) {
      if (playlistRunning || singlePlayingId !== null || queueWorkerRunning) return;
      const targets = clips.filter(clip => !selectedOnly || selectedClips.has(clip.id));
      if (!targets.length || !confirm('永久删除 ' + targets.length + ' 条记录及其本地音频文件？')) return;
      for (const clip of targets) await removeClip(clip.id, true);
    }

    // ============================================================
    // 批量套用
    // ============================================================
    function applySpeakerToAll() {
      const sp = defSpeaker.value;
      clips.forEach(c => { c.speaker = sp; saveClip(c); });
      renderList();
      setStatus(`设备 ${sp.toUpperCase()} 已套用到 ${clips.length} 段`);
    }
    function applySignalToAll() {
      const sg = defSignal.value;
      clips.forEach(c => { c.signal = sg; saveClip(c); });
      renderList();
      setStatus(`信号 ${sg.toUpperCase()} 已套用到 ${clips.length} 段`);
    }
    function applyBothToAll() {
      const sp = defSpeaker.value, sg = defSignal.value;
      clips.forEach(c => { c.speaker = sp; c.signal = sg; saveClip(c); });
      renderList();
      setStatus(`已套用 ${sp.toUpperCase()} + ${sg.toUpperCase()} 到 ${clips.length} 段`);
    }

    // ============================================================
    // 加载 pt 列表
    // ============================================================
    async function loadPTList() {
      ptHint.textContent = "加载中…";
      try {
        const r = await fetch("/api/pt/list");
        if (!r.ok) throw new Error("HTTP " + r.status);
        const data = await r.json();
        rolesData = data.roles || {};
        roleList = Object.keys(rolesData);
        ptHint.textContent = `${roleList.length} 个角色 · ${data.count} 个音色`;
        refreshGeneratorRoles();
        renderLegend();
      } catch (e) {
        ptHint.textContent = "加载失败";
        rolesData = {};
        roleList = [];
        refreshGeneratorRoles();
        renderLegend();
      }
    }

    function refreshGeneratorRoles() {
      const previousRole = genRole.value;
      genRole.innerHTML = "";
      if (roleList.length === 0) {
        const o = document.createElement("option");
        o.value = ""; o.textContent = "(pt/ 下无角色)";
        genRole.appendChild(o);
        fillEmotionOptions($('genEmotionOptions'), '');
        updateGeneratorMode();
        return;
      }
      updateGeneratorMode();
      roleList.forEach(r => {
        const o = document.createElement("option");
        o.value = r; o.textContent = r;
        genRole.appendChild(o);
      });
      if (roleList.includes(previousRole)) genRole.value = previousRole;
      onGeneratorRoleChange();
    }

    function onGeneratorRoleChange() {
      const role = genRole.value;
      fillEmotionOptions($('genEmotionOptions'), role);
      // 给生成器的角色下拉也着色
      applyRoleColorVars(genRole, role);
      applyRoleColorVars(genEmotion, role);
    }

    function renderLegend() {
      roleLegend.innerHTML = "";
      if (roleList.length === 0) {
        roleLegend.textContent = "（无）";
        roleLegend.style.color = "#3a4048";
        return;
      }
      roleList.forEach(r => {
        const span = document.createElement("span");
        const hue = roleHue(r);
        span.style.cssText = `
      display:inline-block; padding:2px 8px; border-radius:3px;
      font-size:11px;
      background: hsla(${hue},60%,30%,0.35);
      color: hsl(${hue},75%,72%);
      border: 1px solid hsla(${hue},60%,55%,0.5);
    `;
        span.textContent = r + " (" + (rolesData[r] || []).length + ")";
        roleLegend.appendChild(span);
      });
    }

    // ============================================================
    // 新建台词
    // ============================================================
    async function designDownloadConsent(design) {
      if (!design) return false;
      await loadCapabilities();
      if (!designCapability) { setGenStatus('无法检查模型状态，请重试', 'err'); return null; }
      if (designCapability.installed) return false;
      if (designCapability.offline) { setGenStatus('离线模式下 VoiceDesign 模型未安装，请先下载模型', 'err'); return null; }
      return confirm('首次使用描述音色需要下载 VoiceDesign 1.7B 完整模型（数 GB），并切换当前推理模型。继续？') ? true : null;
    }

    async function generateClip() {
      if (!libraryLoaded || genBtn.disabled) return;
      const synthesis_mode = generatorMode;
      const role = synthesis_mode === 'design' ? '' : genRole.value;
      const emotion = genEmotion.value.trim() || "平静";
      const text = genText.value.trim();
      const language = genLanguage.value;
      const instruct = synthesis_mode === 'design' ? $('genInstruct').value.trim() : '';

      if (synthesis_mode === 'clone' && !role) { setGenStatus("请先选择角色", "err"); return; }
      if (synthesis_mode === 'design' && !instruct) { setGenStatus('请填写音色描述', 'err'); return; }
      if (!text) { setGenStatus("请输入文本", "err"); return; }
      genBtn.disabled = true;
      try {
      const allow_download = await designDownloadConsent(synthesis_mode === 'design');
      if (allow_download === null) return;
      const clipId = ++clipIdCounter;
      const clip = {
        id: clipId,
        role, emotion, text, language, instruct, synthesis_mode, title: text.slice(0, 60),
        speaker: defSpeaker.value,
        signal: defSignal.value,
        delay: 0,
        buffer: null,
        queued: true,
        generating: false,
        generatedRole: null,
        generatedEmotion: null,
        generatedText: null,
        generatedLanguage: null,
      };
      const record = await (await apiRequest('/api/clips', {method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({...clipMetadata(clip), position: clips.length})})).json();
      applyRecord(clip, record);
      clips.push(clip);
      genText.value = "";
      renderList();

      enqueueJob({ clipId, role, emotion, text, language, instruct, synthesis_mode, allow_download });
      setGenStatus(autoGenerate.checked ? '已加入生成队列' : '已暂存，可继续添加下一条', 'ok');
      } catch (error) { setGenStatus('保存失败：' + error.message, 'err'); }
      finally { updateGeneratorMode(); }
    }

    // ============================================================
    // 事件
    // ============================================================
    playBtn.addEventListener("click", runPlaylist);
    stopBtn.addEventListener("click", stopPlaylist);
    clearBtn.addEventListener("click", () => clearAll());
    genBtn.addEventListener("click", generateClip);
    startBatchBtn.addEventListener('click', startBatch);
    autoGenerate.addEventListener('change', changeAutoGenerate);
    genRole.addEventListener("change", onGeneratorRoleChange);
    $('cloneTab').onclick = () => { generatorMode = 'clone'; updateGeneratorMode(); };
    $('designTab').onclick = () => { generatorMode = 'design'; updateGeneratorMode(); };
    for (const id of ['cloneTab', 'designTab']) {
      $(id).onkeydown = event => {
        if (['ArrowLeft', 'ArrowRight'].includes(event.key)) {
          event.preventDefault();
          const next = id === 'cloneTab' ? $('designTab') : $('cloneTab');
          next.click(); next.focus();
        }
      };
    }
    $('refreshLibrary').onclick = () => { loadLibrary(); loadPTList(); loadCapabilities(); };
    $('librarySearch').oninput = renderList;
    $('selectAll').onchange = event => {
      for (const clip of visibleClips()) {
        if (event.target.checked) selectedClips.add(clip.id); else selectedClips.delete(clip.id);
      }
      renderList();
    };
    $('exportSelected').onclick = () => exportClips(true);
    $('exportAll').onclick = () => exportClips(false);
    $('deleteSelected').onclick = () => clearAll(true);
    $('cancelEdit').onclick = () => $('editDialog').close();
    $('editForm').onsubmit = async event => {
      event.preventDefault();
      const clip = editingClip;
      const previous = clipMetadata(clip);
      const changes = {title: $('editTitle').value.trim(), text: $('editText').value,
        emotion: clip.synthesis_mode !== 'design' ? $('editEmotion').value.trim() || '平静' : clip.emotion,
        language: $('editLanguage').value, instruct: clip.synthesis_mode === 'design' ? $('editInstruct').value.trim() : ''};
      $('saveEdit').disabled = true;
      try {
        Object.assign(clip, changes);
        await saveClip(clip);
        $('editDialog').close();
        renderList(); setStatus('修改已保存');
      } catch (error) { Object.assign(clip, previous); $('editStatus').textContent = error.message; }
      finally { $('saveEdit').disabled = false; }
    };

    applySpeakerAll.addEventListener("click", applySpeakerToAll);
    applySignalAll.addEventListener("click", applySignalToAll);
    applyBothAll.addEventListener("click", applyBothToAll);

    genText.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
        e.preventDefault();
        generateClip();
      }
    });

    // ============================================================
    // 启动
    // ============================================================
    autoGenerate.checked = false;
    updateQueueControls();
    updateGeneratorMode();
    loadLibrary();
    loadPTList();
    loadCapabilities();
    setStatus("就绪");
  </script>

</body>

</html>
